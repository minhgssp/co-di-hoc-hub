<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cò Đi Học • Diễn Đàn Phụ Huynh K-12</title>
  <meta name="description" content="Kho thảo luận thực tế của phụ huynh và giáo viên K-12, đã được chọn lọc và gắn thẻ theo chủ đề.">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dien-dan.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <button type="button" class="mobile-drawer-btn" id="mobileFilterBtn" aria-label="Mở danh mục chủ đề và thẻ" aria-controls="leftSidebar" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <a href="dien-dan.html" class="brand-link">
          <img src="assets/images/logo.svg" alt="Logo Cò Đi Học" class="brand-logo" width="36" height="36">
          <div class="brand-meta">
            <span class="brand-title">Cò Đi Học • Diễn Đàn</span>
            <span class="brand-sub">Cộng đồng phụ huynh K-12</span>
          </div>
        </a>
      </div>

      <div class="search-wrap" role="search">
        <span class="search-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input type="search" id="searchInput" class="search-input" aria-label="Tìm kiếm thảo luận phụ huynh" placeholder="Tìm trường, lớp 1, HSK, 20/11..." autocomplete="off">
        <span class="search-kbd" aria-hidden="true">Ctrl K</span>
      </div>

      <div class="topbar-actions">
        <button type="button" class="btn" id="savedFilterBtn" aria-pressed="false" title="Xem các bài viết bạn đã lưu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
          </svg>
          <span class="saved-btn-label">Đã lưu</span>
          <span class="badge-count num" id="savedCountBadge">0</span>
        </button>

        <button type="button" class="btn btn-icon" id="themeToggleBtn" aria-label="Chuyển giao diện Sáng hoặc Tối" title="Sáng / Tối">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </button>

        <a href="index.html" class="btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="home-link-label">Trang chủ</span>
        </a>
      </div>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

  <div class="app-shell">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar-left" id="leftSidebar" aria-label="Danh mục chủ đề">
      <div class="sidebar-mobile-head">
        <strong>Chủ Đề Thảo Luận</strong>
        <button type="button" class="btn btn-icon" id="closeSidebarBtn" aria-label="Đóng danh mục">✕</button>
      </div>

      <section class="sidebar-card" aria-labelledby="topicsHeading">
        <h2 class="sidebar-heading" id="topicsHeading">
          <span>Chủ Đề Thảo Luận</span>
          <span class="num" id="sidebarTotalClean">0</span>
        </h2>
        <nav aria-label="Lọc theo chủ đề">
          <ul class="nav-list" id="topicNavList"></ul>
        </nav>
      </section>
    </aside>

    <!-- Center Feed -->
    <main class="feed-main" id="mainFeed">
      <h1 class="sr-only">Diễn đàn thảo luận phụ huynh Cò Đi Học</h1>

      <!-- Filter & Sort Bar -->
      <section class="filter-toolbar" aria-label="Sắp xếp và lọc bài viết">
        <div class="toolbar-top-row">
          <div class="toolbar-context">
            <div class="active-chips" id="activeFilterChips">
              <span class="context-title" id="resultCountLabel">Đang tải...</span>
            </div>
            <button type="button" class="clear-filters-btn" id="clearFiltersBtn" hidden>Xóa bộ lọc</button>
          </div>

          <div class="sort-control-wrap">
            <label for="sortSelect" class="sort-label">Sắp xếp:</label>
            <select id="sortSelect" class="sort-select" aria-label="Sắp xếp danh sách bài viết">
              <option value="hot">Đáng chú ý nhất</option>
              <option value="comments">Nhiều bình luận nhất</option>
              <option value="recent">Mới nhất</option>
              <option value="with_comments">Có bình luận</option>
            </select>
          </div>
        </div>

        <div class="quick-tags-bar" id="quickTagsBar" role="group" aria-label="Thẻ lọc nhanh theo chủ đề"></div>
      </section>

      <!-- Feed Posts Container -->
      <div class="post-list" id="postList" aria-live="polite"></div>

      <!-- Pagination -->
      <div class="load-more-wrap" id="loadMoreWrap" hidden>
        <button type="button" class="btn btn-primary" id="loadMoreBtn">Xem thêm bài viết</button>
      </div>
    </main>
  </div>

  <div class="toast-msg" id="toastMsg" role="status" aria-live="polite" hidden></div>

  <script src="assets/js/clean_forum_feed_data.js"></script>
  <script src="assets/js/dien-dan.js"></script>
</body>
</html>
